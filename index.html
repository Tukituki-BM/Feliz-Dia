<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jardín de Girasoles Animado</title>
  <link rel="stylesheet" href="diseño.css">
</head>
<body>

  <!-- Fondo animado con luces y partículas -->
  <div class="glow-bg"></div>
  <div id="particles-container"></div>
  <div id="bokeh-container"></div>

  <!-- Botón de control de música -->
  <button id="musicBtn" class="music-btn" title="Activar/Desactivar Música">
    <svg viewBox="0 0 24 24">
      <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
    </svg>
    Música
  </button>

  <!-- Pradera con césped y flores pequeñas -->
  <div class="grass-ground"></div>
  <div id="gardenContainer" class="garden-container"></div>

<!-- Ilustración principal del Girasol -->
    <div class="flower-container">
      <svg id="sunflowerSvg" viewBox="0 0 500 700" preserveAspectRatio="xMidYMax slice">
        <defs>
          <radialGradient id="centerGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ba753b"/>
            <stop offset="50%" stop-color="#8d4a1b"/>
            <stop offset="85%" stop-color="#5a2c0a"/>
            <stop offset="100%" stop-color="#3d1b03"/>
          </radialGradient>
          
          <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#5e7539"/>
            <stop offset="50%" stop-color="#7a9649"/>
            <stop offset="100%" stop-color="#4d612e"/>
          </linearGradient>

          <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="10" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
          </filter>
        </defs>

        <!-- Tallo principal hasta abajo -->
        <path class="stem" d="M250,750 Q245,550 250,350" />

        <!-- Hojas ajustadas hacia abajo -->
        <path class="leaf leaf-left" d="M248,580 C 120,550 80,430 100,390 C 150,420 215,500 248,540 Z" />
        <path class="leaf leaf-right" d="M252,520 C 380,490 420,370 400,330 C 350,360 285,440 252,480 Z" />

        <!-- Capas de pétalos (ahora centradas en Y=350) -->
        <g id="petalsOuterGroup" transform="translate(250, 350)"></g>
        <g id="petalsMidGroup" transform="translate(250, 350)"></g>
        <g id="petalsInnerGroup" transform="translate(250, 350)"></g>

        <!-- Centro del girasol -->
        <circle class="center-disc" cx="250" cy="350" r="85" />
        <g id="seedsGroup" transform="translate(250, 350)"></g>
      </svg>

      <!-- Subtítulo / Dedicatoria -->
      <div class="subtitle-box">
        Feliz Día de las Flores Amarillas 💛
      </div>
    </div>

  <script src="pagina.js"></script>
</body>
</html>
